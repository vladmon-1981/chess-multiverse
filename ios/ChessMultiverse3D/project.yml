name: ChessMultiverse3D
options:
  developmentLanguage: en
  bundleIdPrefix: com.chessmultiverse
  deploymentTarget:
    iOS: "16.0"

targets:
  ChessMultiverse3D:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - ChessMultiverse3D
    # Веб-версия из корня репозитория кладётся в бандл (папка Web). Зеркало фазы «Copy Web Version»
    # из project.pbxproj: ChessMultiverse3D.xcodeproj правили вручную, project.yml отстал.
    postCompileScripts:
      - name: Copy Web Version
        basedOnDependencyAnalysis: false
        script: |
          WEB="$SRCROOT/../.."
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Web"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$WEB/index.html" "$DEST/"
          rsync -a "$WEB/css" "$WEB/js" "$DEST/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chessmultiverse.app
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4N9Z9JPM6C
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chess 3D
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 20261022
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.board-games
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
